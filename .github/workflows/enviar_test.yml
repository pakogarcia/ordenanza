name: Enviar Test Oposiciones a Telegram

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-y-enviar-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar bateria de 5 preguntas y enviar a Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python 2_generar_test.py

      - name: Guardar progreso de temario.db en el repositorio
        run: |
          git config user.name "pakogarcia"
          git config user.email "pako.garcia.tutor@gmail.com"
          git add temario.db
          git diff --staged --quiet || git commit -m "chore: actualizar contador veces_usado en temario.db"
          git push
